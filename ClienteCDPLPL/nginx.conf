# ===========================================================================
# Nginx del Frontend_GDS: sirve el SPA de React/Vite y actua como reverse
# proxy del ServidorGDS (backend NestJS) dentro de la red interna de Docker.
#
#   - `/`           -> archivos estaticos del SPA (fallback a index.html para
#                      el enrutado del lado cliente de React Router).
#   - `/api/gds`    -> proxy HTTP al ServidorGDS (mismo-origen para el navegador).
#   - `/socket.io`  -> proxy WebSocket (progreso en vivo via socket.io).
#
# El nombre `servidor-gds` se resuelve por el DNS interno de docker-compose.
# El `Servicio_IA` (Python) NO se proxea: vive solo en la red interna.
# ===========================================================================

upstream servidor_gds {
    server servidor-gds:4100;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion basica de los activos del SPA.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: cualquier ruta no encontrada cae en index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy de la API del ServidorGDS (prefijo global `/api/gds`).
    location /api/gds/ {
        proxy_pass http://servidor_gds;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Reverse proxy del WS Hub de progreso (socket.io) con upgrade de protocolo.
    location /socket.io/ {
        proxy_pass http://servidor_gds;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
